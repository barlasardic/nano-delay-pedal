e x1="72" y1="169" x2="72" y2="175" stroke="#203c34" stroke-width="0.3"/><line x1="82" y1="169" x2="82" y2="175" stroke="#203c34" stroke-width="0.3"/><text x="49" y="182" font-size="3.2">50 mm calibration</text><text x="18" y="207" font-size="3.1" font-weight="bold">Use this page only for PCB outline and mounting holes.</text><text x="18" y="216" font-size="3.1">Do not use it to drill jack, pot, footswitch or USB openings.</text><text x="18" y="225" font-size="3.1">Use insulated spacers; verify screw-head and wire clearances.</text><text x="18" y="234" font-size="3.1">Keep the top/bottom orientation consistent when transferring the pattern.</text><text x="18" y="243" font-size="3.1">Manufacturing board outline is the matching Edge.Cuts Gerber.</text><text x="18" y="282" font-size="3.0" font-weight="bold">Dimensions are authoritative; reject any print whose calibration bar is not 50 mm.</text></g></svg>