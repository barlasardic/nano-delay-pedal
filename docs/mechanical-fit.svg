" height="14" rx="0" fill="none" stroke="#967f59" stroke-width=".25" stroke-dasharray="1,1"/><circle cx="15.84" cy="56.26" r="0.9" fill="#425d51" stroke="#455" stroke-width=".2"/><circle cx="66.64" cy="56.26" r="0.9" fill="#425d51" stroke="#455" stroke-width=".2"/><text x="31" y="68" font-size="3.4" font-weight="bold">PCB</text><text x="21" y="74" font-size="3.3">55.88 x 88.90</text><text x="26" y="116" font-size="3.3">SW</text><line x1="73" y1="21.92" x2="73" y2="29.64" stroke="#216c88" stroke-width="0.9"/></g><line x1="22" y1="41" x2="95" y2="41" stroke="#647977" stroke-width="0.2"/><line x1="22" y1="39" x2="22" y2="43" stroke="#647977" stroke-width="0.2"/><line x1="95" y1="39" x2="95" y2="43" stroke="#647977" stroke-width="0.2"/><text x="56" y="39" font-size="3">73</text><line x1="17" y1="45" x2="17" y2="174" stroke="#647977" stroke-width="0.2"/><line x1="15" y1="45" x2="19" y2="45" stroke="#647977" stroke-width="0.2"/><line x1="15" y1="174" x2="19" y2="174" stroke="#647977" stroke-width="0.2"/><text x="7" y="111" font-size="3">129</text><text x="106" y="48" font-size="2.9" font-weight="bold">CUSTOM HOUSING ASSUMPTIONS</text><text x="106" y="55" font-size="2.9">Wall thickness: 2.5</text><text x="106" y="62" font-size="2.9">PCB origin: X 13.30, Y 8.00</text><text x="106" y="69" font-size="2.9">Nano USB face: X 70.50</text><text x="106" y="76" font-size="2.9">PCB holes in enclosure coordinates:</text><text x="106" y="83" font-size="2.9">H1  17.11, 11.81</text><text x="106" y="90" font-size="2.9">H2  65.37, 11.81</text><text x="106" y="97" font-size="2.9">H3  17.11, 93.09</text><text x="106" y="104" font-size="2.9">H4  65.37, 93.09</text><text x="106" y="123" font-size="2.7" font-weight="bold">Solid green: PCB and Nano</text><text x="106" y="129" font-size="2.7">Gold outlines: proposed panel parts</text><text x="106" y="135" font-size="2.7">Dashed gold: jack body reservations</text><text x="106" y="141" font-size="2.7">Jack bodies overlap the PCB in plan;</text><text x="106" y="147" font-size="2.7">their height must clear the components.</text><text x="106" y="153" font-size="2.7">USB opening shown in blue.</text><text x="106" y="159" font-size="2.7">Cutout size depends on Nano and plug.</text><text x="18" y="191" font-size="3.1" font-weight="bold">Fit checks before drilling the enclosure</text><text x="18" y="199" font-size="3.1">Use the selected jack, pot, switch and Nano drawings to set panel holes.</text><text x="18" y="207" font-size="3.1">Start with 5 mm clearance below the PCB and 25 mm above it; confirm actual heights.</text><text x="18" y="215" font-size="3.1">The 59 mm figure is an overall pedal reference, including external hardware.</text><text x="18" y="223" font-size="3.1">Provide room for knobs, panel thickness, plugs, wires and strain relief.</text><text x="18" y="231" font-size="3.1">This concept does not guarantee fit in an existing BOSS enclosure.</text><text x="18" y="239" font-size="3.1">Reference: BOSS DS-1 published external dimensions (see design-review.md).</text><text x="18" y="282" font-size="3.1" font-weight="bold">ENCLOSURE CONCEPT - use the next page for the exact PCB mounting pattern.</text></g></svg>